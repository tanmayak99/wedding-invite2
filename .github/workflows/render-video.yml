name: Render video
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [invite.config.json, "public/**", "src/**"]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx remotion browser ensure
      - run: npm run video
      - uses: actions/upload-artifact@v4
        with: { name: invite-video, path: out/invite.mp4 }
